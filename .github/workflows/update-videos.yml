name: Update YouTube Videos

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Update videos.json
        env:
          YOUTUBE_CHANNEL_ID: "UCAHKkRUMuXQMxZX__vkpixg"
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET

          channel_id = __import__("os").environ["YOUTUBE_CHANNEL_ID"]

          url = f"https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}"

          data = urllib.request.urlopen(url).read()
          root = ET.fromstring(data)

          ns = {
              "yt": "http://www.youtube.com/xml/schemas/2015",
              "media": "http://search.yahoo.com/mrss/",
              "atom": "http://www.w3.org/2005/Atom"
          }

          videos = []

          for entry in root.findall("atom:entry", ns):
              video_id = entry.find("yt:videoId", ns).text
              title = entry.find("atom:title", ns).text
              published = entry.find("atom:published", ns).text

              videos.append({
                  "id": video_id,
                  "title": title,
                  "published": published,
                  "url": f"https://www.youtube.com/watch?v={video_id}",
                  "thumbnail": f"https://i.ytimg.com/vi/{video_id}/hqdefault.jpg"
              })

          with open("videos.json", "w", encoding="utf-8") as f:
              json.dump({"videos": videos}, f, indent=2, ensure_ascii=False)
          PY

      - name: Commit updated videos.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git diff --cached --quiet || git commit -m "Auto update YouTube videos"
          git push
